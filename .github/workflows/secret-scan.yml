name: Dependency audit and repository hygiene

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  tracked-dependencies:
    name: Warn about tracked node_modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect tracked dependency directories
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)node_modules/'; then
            echo '::warning::Tracked node_modules should be removed in a separate reviewed cleanup.'
          else
            echo 'No tracked node_modules paths detected.'
          fi
