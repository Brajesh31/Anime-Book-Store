name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Build production bundle
        run: npm run build

  backend:
    name: Backend unit tests and syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run request validation tests
        run: npm test
      - name: Check backend JavaScript syntax
        run: |
          node --check index.js
          node --check config.js
          node --check routes/booksRoute.js
          node --check models/bookModel.js
          node --check utils/bookValidation.js

  documentation:
    name: Validate relative Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          failures = []
          for markdown_file in Path('.').rglob('*.md'):
              if any(part in {'.git', 'node_modules'} for part in markdown_file.parts):
                  continue
              source = markdown_file.read_text(encoding='utf-8')
              for target in re.findall(r'\]\((?!https?://|#)([^)]+)\)', source):
                  target = target.split('#', 1)[0]
                  if target and not (markdown_file.parent / target).resolve().exists():
                      failures.append(f'{markdown_file}: {target}')

          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)

          print('All relative Markdown links resolve.')
          PY
