name: 📖 Documentation improvement
description: Report missing or unclear documentation.
title: '[Docs]: '
labels: ['documentation']
body:
  - type: input
    id: location
    attributes:
      label: File or section
      placeholder: docs/architecture.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or inaccurate?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
    validations:
      required: false
