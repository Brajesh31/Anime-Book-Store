name: 🐛 Bug report
description: Report a reproducible defect.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: 'Do not include credentials, database URLs, tokens, or private records.'
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Frontend
        - Backend API
        - MongoDB persistence
        - Build or tooling
        - Documentation
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and redacted logs
    validations:
      required: true
